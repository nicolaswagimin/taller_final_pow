<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Preconteo Electoral — Difusión Pública</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --c1: #3b82f6;
      --c2: #10b981;
      --c3: #f59e0b;
      --blanco: #94a3b8;
      --nulo: #ef4444;
      --no-marcado: #64748b;
      --warn: #eab308;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1rem;
    }
    .contenedor { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: var(--border);
      color: var(--text-muted);
      font-weight: 600;
    }
    .badge.vivo { background: #064e3b; color: #6ee7b7; }
    .badge.degradado { background: #713f12; color: #fde047; }
    .badge.desconectado { background: #7f1d1d; color: #fca5a5; }

    .alerta-degradado {
      display: none;
      background: #78350f;
      border: 1px solid var(--warn);
      color: #fef08a;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
    }

    .selector-fila {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
    select, input {
      background: #0f172a;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.9rem;
    }

    .mesas-box {
      margin-top: 0.5rem;
    }
    .barra-progreso-bg {
      background: #0f172a;
      height: 10px;
      border-radius: 9999px;
      overflow: hidden;
      margin: 0.4rem 0;
    }
    .barra-progreso-fill {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .mesas-texto {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .candidatos-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .candidato-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .candidato-encabezado {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .candidato-nombre { font-weight: 600; }
    .candidato-votos { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .candidato-barra-bg {
      background: #0f172a;
      height: 14px;
      border-radius: 4px;
      overflow: hidden;
    }
    .candidato-barra-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .correcciones-box {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      max-height: 140px;
      overflow-y: auto;
    }
    .correccion-item {
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: #cbd5e1;
    }
    .correccion-item strong { color: var(--warn); }
    footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      padding-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>Preconteo Electoral</h1>
      <div id="badge-estado" class="badge">Iniciando...</div>
    </header>

    <div id="alerta-pausa" class="alerta-degradado">
      ⚠️ Datos en pausa desde <span id="hora-pausa">--:--</span>
    </div>

    <!-- Selector de Tópico -->
    <div class="card">
      <div class="selector-fila">
        <label for="tipo-nivel">Nivel:</label>
        <select id="tipo-nivel">
          <option value="dep">Departamento (Total)</option>
          <option value="mun">Municipio</option>
          <option value="pue">Puesto</option>
        </select>

        <div id="grupo-mun" style="display:none;">
          <label for="select-mun">Municipio:</label>
          <select id="select-mun"></select>
        </div>

        <div id="grupo-pue" style="display:none;">
          <label for="input-pue">N° Puesto:</label>
          <input type="number" id="input-pue" value="176" min="1" max="9999">
          <button id="btn-ir-pue" style="padding: 0.4rem 0.8rem; background: var(--primary); color: #000; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Ir</button>
        </div>
      </div>
    </div>

    <!-- Mesas Informadas -->
    <div class="card">
      <div class="mesas-box">
        <div class="mesas-texto">
          <span>Mesas Informadas</span>
          <span id="txt-mesas-pct">0.0%</span>
        </div>
        <div class="barra-progreso-bg">
          <div id="barra-mesas" class="barra-progreso-fill"></div>
        </div>
        <div class="mesas-texto">
          <span id="txt-mesas-conteo">0 de 0 mesas</span>
          <span id="txt-seq">Seq: -</span>
        </div>
      </div>
    </div>

    <!-- Resultados por Candidato -->
    <div class="card">
      <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Resultados</h2>
      <div id="candidatos-lista" class="candidatos-grid"></div>
    </div>

    <!-- Avisos de Corrección -->
    <div class="card" id="card-correcciones" style="display:none;">
      <h2 style="font-size: 1.0rem; color: var(--warn); margin-bottom: 0.4rem;">Correcciones Registradas</h2>
      <div id="correcciones-lista" class="correcciones-box"></div>
    </div>

    <footer>
      Actualización en vivo vía Server-Sent Events (SSE) &bull; Sin frameworks &bull; DOM optimizado con rAF
    </footer>
  </div>

  <script>
    // Configuración y colores de candidatos
    const COLORES = {
      C1: 'var(--c1)',
      C2: 'var(--c2)',
      C3: 'var(--c3)',
      BLANCO: 'var(--blanco)',
      NULO: 'var(--nulo)',
      NO_MARCADO: 'var(--no-marcado)'
    };

    // Estado local
    let topicoActual = 'dep';
    let seqActual = '';
    let totales = { C1: 0, C2: 0, C3: 0, BLANCO: 0, NULO: 0, NO_MARCADO: 0 };
    let ranking = [];
    let informadas = 0;
    let totalMesas = 0;
    let correcciones = [];
    let degradado = false;
    let horaDegradado = '';

    // Manejo de render batched con requestAnimationFrame (RT-9)
    let renderPendiente = false;
    function solicitarRender() {
      if (renderPendiente) return;
      renderPendiente = true;
      requestAnimationFrame(() => {
        renderPendiente = false;
        render();
      });
    }

    function render() {
      // Estado y degradado
      const badge = document.getElementById('badge-estado');
      const alertaPausa = document.getElementById('alerta-pausa');
      const horaPausaSpan = document.getElementById('hora-pausa');

      if (degradado) {
        badge.className = 'badge degradado';
        badge.textContent = 'En pausa';
        alertaPausa.style.display = 'block';
        horaPausaSpan.textContent = horaDegradado;
      } else if (clienteSse && clienteSse.estaConectado()) {
        badge.className = 'badge vivo';
        badge.textContent = '● En vivo';
        alertaPausa.style.display = 'none';
      } else {
        badge.className = 'badge desconectado';
        badge.textContent = clienteSse ? clienteSse.textoEstado() : 'Desconectado';
        alertaPausa.style.display = 'none';
      }

      // Mesas informadas
      const pct = totalMesas > 0 ? ((informadas / totalMesas) * 100).toFixed(1) : '0.0';
      document.getElementById('txt-mesas-pct').textContent = pct + '%';
      document.getElementById('barra-mesas').style.width = pct + '%';
      document.getElementById('txt-mesas-conteo').textContent = `${informadas.toLocaleString()} de ${totalMesas.toLocaleString()} mesas`;
      document.getElementById('txt-seq').textContent = seqActual ? `Seq: ${seqActual}` : '';

      // Total votos calculados para porcentaje
      let totalVotos = 0;
      for (const cand in totales) totalVotos += (totales[cand] || 0);

      // Candidatos
      const lista = document.getElementById('candidatos-lista');
      lista.innerHTML = '';

      // Ordenar por ranking si está disponible, o por mayor votos
      const items = ranking.length > 0 ? ranking : Object.entries(totales).map(([c, v]) => ({ candidato: c, votos: v })).sort((a,b) => b.votos - a.votos);

      for (const item of items) {
        const c = item.candidato;
        const v = totales[c] || 0;
        const cPct = totalVotos > 0 ? ((v / totalVotos) * 100).toFixed(2) : '0.00';
        const color = COLORES[c] || 'var(--primary)';

        const div = document.createElement('div');
        div.className = 'candidato-item';
        div.innerHTML = `
          <div class="candidato-encabezado">
            <span class="candidato-nombre">${c}</span>
            <span class="candidato-votos"><strong>${v.toLocaleString()}</strong> (${cPct}%)</span>
          </div>
          <div class="candidato-barra-bg">
            <div class="candidato-barra-fill" style="width: ${cPct}%; background: ${color};"></div>
          </div>
        `;
        lista.appendChild(div);
      }

      // Correcciones
      const cardCorr = document.getElementById('card-correcciones');
      const listaCorr = document.getElementById('correcciones-lista');
      if (correcciones.length > 0) {
        cardCorr.style.display = 'block';
        listaCorr.innerHTML = correcciones.map(c => `
          <div class="correccion-item">
            <strong>${c.acta}</strong>: ${c.motivo}
          </div>
        `).join('');
      } else {
        cardCorr.style.display = 'none';
      }
    }

    // Cliente SSE propio con backoff exponencial y full jitter (RF-10b)
    class ClienteSse {
      constructor(topico, alCambioEstado) {
        this.topico = topico;
        this.alCambioEstado = alCambioEstado;
        this.conectado = false;
        this.intento = 0;
        this.abortController = null;
        this.reintentandoTexto = '';
        this.activo = true;

        const params = new URLSearchParams(window.location.search);
        this.usarJitter = params.get('jitter') !== '0';
      }

      estaConectado() { return this.conectado; }
      textoEstado() { return this.reintentandoTexto || 'Desconectado'; }

      conectar() {
        if (!this.activo) return;
        this.abortController = new AbortController();

        const url = new URL('/sse', window.location.origin);
        url.searchParams.set('topico', this.topico);
        if (seqActual) {
          url.searchParams.set('desde', seqActual);
        }

        const headers = {};
        if (seqActual) {
          headers['Last-Event-ID'] = seqActual;
        }

        fetch(url, { headers, signal: this.abortController.signal })
          .then(async (res) => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            this.conectado = true;
            this.intento = 0;
            this.reintentandoTexto = '';
            this.alCambioEstado();

            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const mensajes = buffer.split('\n\n');
              buffer = mensajes.pop(); // guardar residuo no completado

              for (const bloque of mensajes) {
                if (bloque.trim()) this.procesarMensaje(bloque);
              }
            }
            throw new Error('Flujo cerrado por el servidor');
          })
          .catch((err) => {
            if (!this.activo) return;
            this.conectado = false;
            this.programarReintento();
          });
      }

      procesarMensaje(bloque) {
        const lineas = bloque.split('\n');
        let evento = 'message';
        let dataStr = '';
        let idMsg = '';

        for (const l of lineas) {
          if (l.startsWith('event:')) evento = l.slice(6).trim();
          else if (l.startsWith('data:')) dataStr = l.slice(5).trim();
          else if (l.startsWith('id:')) idMsg = l.slice(3).trim();
        }

        if (idMsg) seqActual = idMsg;

        if (evento === 'snapshot') {
          try {
            const snap = JSON.parse(dataStr);
            totales = snap.totales || {};
            ranking = snap.ranking || [];
            informadas = snap.informadas || 0;
            totalMesas = snap.total_mesas || 0;
            if (snap.seq) seqActual = snap.seq;
            solicitarRender();
          } catch (e) {}
        } else if (evento === 'delta') {
          try {
            const d = JSON.parse(dataStr);
            if (d.seq) seqActual = d.seq;
            if (d.informadas !== undefined) informadas += d.informadas;
            if (d.total_mesas !== undefined && d.total_mesas > 0) totalMesas = d.total_mesas;
            if (d.delta) {
              for (const cand in d.delta) {
                totales[cand] = (totales[cand] || 0) + d.delta[cand];
              }
            }
            if (d.correcciones && d.correcciones.length > 0) {
              correcciones.unshift(...d.correcciones);
              if (correcciones.length > 20) correcciones = correcciones.slice(0, 20);
            }
            solicitarRender();
          } catch (e) {}
        } else if (evento === 'estado') {
          try {
            const est = JSON.parse(dataStr);
            degradado = Boolean(est.degradado);
            if (degradado) {
              const ahora = new Date();
              horaDegradado = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            solicitarRender();
          } catch (e) {}
        } else if (evento === 'reconecta') {
          this.desconectar();
          this.conectar();
        }
      }

      programarReintento() {
        this.intento++;
        // Full jitter: random(0, min(30 s, 1 s × 2^intento))
        const maxMs = Math.min(30_000, 1_000 * Math.pow(2, this.intento));
        const esperaMs = this.usarJitter ? Math.floor(Math.random() * (maxMs + 1)) : maxMs;

        const seg = (esperaMs / 1000).toFixed(1);
        this.reintentandoTexto = `Reconectando en ${seg}s...`;
        this.alCambioEstado();

        setTimeout(() => {
          if (this.activo) this.conectar();
        }, esperaMs);
      }

      desconectar() {
        this.activo = false;
        if (this.abortController) {
          this.abortController.abort();
        }
      }
    }

    let clienteSse = null;

    function cambiarTopico(nuevoTopico) {
      if (clienteSse) {
        clienteSse.desconectar();
      }
      topicoActual = nuevoTopico;
      seqActual = '';
      totales = { C1: 0, C2: 0, C3: 0, BLANCO: 0, NULO: 0, NO_MARCADO: 0 };
      ranking = [];
      informadas = 0;
      totalMesas = 0;
      correcciones = [];
      solicitarRender();

      clienteSse = new ClienteSse(topicoActual, () => solicitarRender());
      clienteSse.conectar();
    }

    // Inicializar selectores
    const tipoNivel = document.getElementById('tipo-nivel');
    const grupoMun = document.getElementById('grupo-mun');
    const selectMun = document.getElementById('select-mun');
    const grupoPue = document.getElementById('grupo-pue');
    const inputPue = document.getElementById('input-pue');
    const btnIrPue = document.getElementById('btn-ir-pue');

    for (let m = 1; m <= 40; m++) {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = `Municipio ${m}`;
      if (m === 11) opt.selected = true;
      selectMun.appendChild(opt);
    }

    tipoNivel.addEventListener('change', () => {
      const val = tipoNivel.value;
      if (val === 'dep') {
        grupoMun.style.display = 'none';
        grupoPue.style.display = 'none';
        cambiarTopico('dep');
      } else if (val === 'mun') {
        grupoMun.style.display = 'inline-flex';
        grupoPue.style.display = 'none';
        cambiarTopico(`mun:${selectMun.value}`);
      } else if (val === 'pue') {
        grupoMun.style.display = 'none';
        grupoPue.style.display = 'inline-flex';
        cambiarTopico(`pue:${inputPue.value}`);
      }
    });

    selectMun.addEventListener('change', () => {
      cambiarTopico(`mun:${selectMun.value}`);
    });

    btnIrPue.addEventListener('click', () => {
      cambiarTopico(`pue:${inputPue.value}`);
    });

    // Iniciar por defecto en dep
    cambiarTopico('dep');
  </script>
</body>
</html>
