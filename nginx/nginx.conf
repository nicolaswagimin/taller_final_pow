# Balanceador frente a las 8 réplicas de app. Round-robin, SIN ip_hash ni sticky (RT-2).
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 65535;
  multi_accept on;
}

http {
  # DNS interno de Docker: "app" resuelve a las IP de todas las réplicas.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream app {
    zone app 64k;
    # `resolve` re-consulta el DNS de Docker: si una réplica se reinicia con otra IP, se sigue repartiendo entre las 8.
    server app:3000 resolve;
    keepalive 64;
  }

  sendfile on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  access_log off;

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Público: Server-Sent Events. Sin buffer ni caché para que cada evento salga al instante.
    location /sse {
      proxy_pass http://app;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    # Auditores: WebSocket.
    location /ws {
      proxy_pass http://app;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Todo lo demás: proxy normal con keepalive hacia las réplicas.
    location / {
      proxy_pass http://app;
      proxy_set_header Connection '';
    }
  }
}
